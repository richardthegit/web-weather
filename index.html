<!DOCTYPE html>
<html lang='en'>
  <head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>

    <title>Weather</title>
    <link rel='stylesheet' href='style/reset.css'>
    <link rel='stylesheet' href='style/layout.css'>
    <link rel='stylesheet' href='style/colors.css'>
    <link rel='stylesheet' href='style/styles.css'>

    <link rel='preconnect' href='https://fonts.googleapis.com'>
    <link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
    <link href='https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap' rel='stylesheet'>
  </head>
  <body class='combo-21'>
    <div id='forecast-container' class='flex-row flex-gap-2'></div>

    <template id='hourly-card-template'>
      <div class='hour-cell flex-col flex-gap-2'>
        <div class='time subcell fw-3'></div>

        <div class='sky subcell'>

          <div>
            <span class='material-symbols-outlined'>cloud</span>
            <span class='cloud-high'></span>
            <div class='thin-line cloud-line mb-2'></div>
          </div>

          <div>
            <span class='material-symbols-outlined'>cloud</span>
            <span class='cloud-mid'></span>
            <div class='mid-line cloud-line mb-2'></div>
          </div>

          <div>
            <span class='material-symbols-outlined'>cloud</span>
            <span class='cloud-low'></span>
            <div class='thick-line cloud-line mb-2'></div>
          </div>

          <div class='right mt-3'>
            <span class='material-symbols-outlined'>rainy</span>
            <span class='precip'></span>
          </div>
        </div>

        <div class='ground subcell'>
          <div class='mb-1'>
            <span class='material-symbols-outlined'>device_thermostat</span> 
            <span class='temp'></span>°
          </div>
          
          <div class='right mb-1'>
            <span class='material-symbols-outlined'>cool_to_dry</span>
            <span class='humid'></span>%
          </div>

          <div>
            <span class='material-symbols-outlined'>air</span>
            <span class='windspeed'></span>m/s
          </div>
        </div>
      </div>
    </template>

    <script src='code.js'></script>
    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const lat = urlParams.get('lat');
      const lon = urlParams.get('lon');
      const container = document.getElementById('forecast-container');
      const template = document.getElementById('hourly-card-template');
      const styles = ['combo-152', 'combo-149', 'combo-188', 'combo-21'];
      var styleIndex = 0, minuteCount = 0;

      function populate(hourlyData) {  
        // Clear any existing content
        container.replaceChildren();

        // Create a fragment to batch DOM updates for speed
        const fragment = document.createDocumentFragment();
        var dayCount = 6;

        hourlyData.forEach(item => {
          dayCount --;
          if (dayCount >= 0) {
            const clone = template.content.cloneNode(true);
            setVariableWeight(qs(clone, '.cloud-high'), item.cloud_high, 10, 50, '%');
            setVariableWeight(qs(clone, '.cloud-mid'), item.cloud_mid, 10, 50, '%');
            setVariableWeight(qs(clone, '.cloud-low'), item.cloud_low, 10, 50, '%');
            setVariableWeight(qs(clone, '.precip'), item.precip, 0.19, 0.49, 'mm');
            qs(clone, '.temp').textContent = item.temp;
            qs(clone, '.humid').textContent = item.humid;
            qs(clone, '.windspeed').textContent = item.wind_10m;
            qs(clone, '.time').textContent = item.time;
            fragment.appendChild(clone);
          }
        });

        // Append everything to the DOM in a single write operation
        container.appendChild(fragment);
      }

      function update() {
        /* Change the style every few minutes. */
        minuteCount ++;
        if (minuteCount > 9) {
          minuteCount = 0;
          styleIndex = (styleIndex + 1) % styles.length;
          document.body.className = styles[styleIndex];
        }
        else {
          /* Only rebuild the doc when we're not animating between styles. */
          fetchWeather(lat, lon).then(data => populate(data));
        }
      }
      const interval = new ManagedInterval(60, update);

      /* Go full-screen on tap. */
      function goFullscreen() {
          const elem = document.documentElement;
          if (elem.requestFullscreen) {
              elem.requestFullscreen();
          }

      }
      document.addEventListener('click', goFullscreen, { once: true });

      /* Aquire the wake lock to prevent the screen going dim. */
      let wakeLock = null;
      async function requestWakeLock() {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
        } catch (err) {
          console.log(`Wake Lock Error: ${err.name}, ${err.message}`);
        }
      }
      requestWakeLock();
    </script>
  </body>
</html>
